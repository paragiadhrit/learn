<style>
 #start-btn {
transform: scale(3);

 		font-family: monospace;
border-radius: 40px;
		border:none;
padding: 15px;
		padding-left: 25px;
padding-right: 25px;
transition: ease-in-out, 0.8s;
position: absolute;
top: 50%;
left: 50%;
 	}
#start-btn:hover {
cursor: pointer;
transform: scale(3.05);
box-shadow: 0px 0px 40px 0px #ccffe6;
 }
#start-btn:active {
transition: ease-in-out, 0.25s;
transform: scale(2.5);
box-shadow: 0px 0px 0px 0px #aad4d4;
	}
 #center {
  		position: relative; 
  		height: 100vh;
 }
 	body {
 		background-color: #ffccff
 }
 @keyframes fadeInUp {
  0% {
    transform: translateY(100%);
    opacity: 0;
  }
  100% {
    transform: translateY(0%);
    opacity: 1;
  }
}
.fadeInUp-animation {
  animation: 1.5s fadeInUp;
}
#paragraph1 {
 display: none;
 position: absolute;
}
#paragraph2 {
 display: none;
 position: absolute;
}
</style>
<body>
<div id="center"> 
<button id="start-btn" onclick="this.remove(); next(0);"> start </button> 
</div>
<div id="paragraph1"> <p> 29348rijbn2rmfogifgsldkgsd </p> 
<button id="next-1" onclick="this.remove(); next(1); document.getElementById('paragraph1').remove();"> next</button> 
</div>
<div id="paragraph2">
<img src="ddd" style="transform: scale(2); float: top; margin:10px; padding: 5px"> 
 <p style = "text-indent: 40px;"> 2111111111111111111111111d </p> 
</div>
</body>
<script>
var paragraph1 = document.querySelector("#paragraph1");
var paragraph2 = document.querySelector("#paragraph2");
var centerDiv = document.querySelector("#center");
function next(num) {
 centerDiv.style.height = "0px"; 
 const paragraphs = [paragraph1, paragraph2];
 paragraphs[num].style.display="block";
 paragraphs[num].style.position="static";
 paragraphs[num].className="fadeInUp-animation";
}
</script>
