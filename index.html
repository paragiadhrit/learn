<style>
 #start-btn {
transform: scale(3);

 		font-family: monospace;
border-radius: 40px;
		border:none;
padding: 15px;
		padding-left: 25px;
padding-right: 25px;
transition: ease-in-out, 0.8s;
position: absolute;
top: 50%;
left: 50%;
 	}
#start-btn:hover {
cursor: pointer;
transform: scale(3.05);
box-shadow: 0px 0px 40px 0px #ccffe6;
 }
#start-btn:active {
transition: ease-in-out, 0.25s;
transform: scale(2.5);
box-shadow: 0px 0px 0px 0px #aad4d4;
	}
 #center {
  		position: relative; 
  		height: 100vh;
 }
 	body {
 		background-color: #ffccff
 }
 @keyframes fadeInUp {
  0% {
    transform: translateY(100%);
    opacity: 0;
  }
  100% {
    transform: translateY(0%);
    opacity: 1;
  }
}
.fadeInUp-animation {
  animation: 1.5s fadeInUp;
}
#paragraph1 {
 display: none;
 position: absolute;
}
#paragraph2 {
 display: none;
 position: absolute;
}
</style>
<body>
<div id="center"> 
<button id="start-btn" onclick="next(0); this.remove();"> start </button> 
</div>
<p id="paragraph1" class="fadeInUp-animation"> 29348rijbn2rmfogifgsldkgsd </p>
<p id="paragraph2" class="fadeInUp-animation"> 2111111111111111111111111d </p>
</body>

<script>
var paragraph1 = document.querySelector("#paragraph1");
var paragraph2 = document.querySelector("#paragraph2");
function next(num) {
 const paragraphs = [paragraph1, paragraph2];
 paragraphs[num].style.display="revert";
 paragraphs[num].style.position="static";
}

</script>
